[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "box-cache"
version = "0.1.0"
description = "A Windows file cache that preserves historical evidence."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Mask-coins/box_cache"
Issues = "https://github.com/Mask-coins/box_cache/issues"

[project.scripts]
box-cache = "box_cache.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

